name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Container and /api integration tests (Docker)
        run: npm run test:container
        env:
          REQUIRE_DOCKER: '1'
      - name: Check the deploy configuration (wrangler deploy --dry-run)
        run: npx vite build && npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry-run"
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests on the Cloudflare runtime (wrangler dev)
        run: npm run test:e2e
        env:
          CI: 'true'
          E2E_HOST: cloudflare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: test-results/
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Uploads the Worker and assets, and builds and pushes the container image with the runner's Docker.
      - name: wrangler deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
